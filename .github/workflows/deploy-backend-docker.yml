name: Deploy dance-platform backend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-video-repo-backend-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dance-platform-backend
  CONTAINER_DIR: /opt/apps/video-repo
  PUBLIC_API_HOST: api.video-repo.eduardosalasg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dance-platform/backend db:generate

      - name: Run backend tests
        run: pnpm --filter @dance-platform/backend test

      - name: Run backend build
        run: pnpm --filter @dance-platform/backend build

      - name: Normalize image name
        run: |
          IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=$IMAGE_NAME:${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --provenance=false \
            --push \
            -f apps/backend/Dockerfile \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          cat > ~/.ssh/config <<SSHCONF
          Host *
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
            ServerAliveCountMax 60
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Copy docker-compose.yml to server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "mkdir -p ${{ env.CONTAINER_DIR }}"
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "cat > ${{ env.CONTAINER_DIR }}/docker-compose.yml" \
            < apps/backend/docker-compose.yml

      - name: Deploy on Oracle VM
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'
              set -e

              cd "${{ env.CONTAINER_DIR }}"

              exec 9>/tmp/oracle-docker-deploy.lock
              flock -w 900 9 || {
                echo "Could not acquire server deploy lock"
                exit 1
              }

              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
                -u "${{ secrets.GHCR_USERNAME }}" \
                --password-stdin

              export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
              if [ -z "$BACKEND_IMAGE" ]; then
                echo "BACKEND_IMAGE is not set"
                exit 1
              fi

              MIGRATION_DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}"
              if [ -z "$MIGRATION_DATABASE_URL" ]; then
                echo "MIGRATION_DATABASE_URL secret is not set"
                exit 1
              fi

              echo "--- pulling exact backend image: $BACKEND_IMAGE ---"
              docker pull "$BACKEND_IMAGE"

              echo "--- running prisma migrations one-shot ---"
              docker rm -f dance-platform-migrate 2>/dev/null || true
              if ! timeout 300 docker run \
                --name dance-platform-migrate \
                --rm \
                -e DATABASE_URL="$MIGRATION_DATABASE_URL" \
                -w /app/apps/backend \
                "$BACKEND_IMAGE" \
                npx prisma migrate deploy; then
                echo "Migration failed or timed out"
                docker rm -f dance-platform-migrate 2>/dev/null || true
                exit 1
              fi

              echo "--- recreating backend with new image ---"
              docker compose up -d --force-recreate --remove-orphans backend

              echo "--- backend startup logs ---"
              docker compose logs --tail=50 backend || true

              for attempt in $(seq 1 60); do
                echo "Health check attempt $attempt/60 ..."
                if curl -fsS --max-time 5 --connect-timeout 2 http://127.0.0.1:3001/api/health > /dev/null; then
                  break
                fi

                if [ "$attempt" -eq 60 ]; then
                  echo "Backend failed health check after deploy."
                  docker compose ps
                  docker compose logs --tail=100 backend || true
                  exit 1
                fi

                sleep 2
              done

              # A health response alone can come from an older container image.
              # This protected route must exist and reject the anonymous probe.
              route_status=$(curl -s -o /dev/null --max-time 5 --connect-timeout 2 -w "%{http_code}" http://127.0.0.1:3001/api/auth/me)
              if [ "$route_status" != "401" ]; then
                echo "Expected /api/auth/me to return 401 after deploy; received $route_status."
                docker compose ps
                docker compose logs --tail=100 backend || true
                exit 1
              fi

              echo "--- pruning dangling images ---"
              docker image prune -f
          EOF

      - name: Reload Nginx and verify its API upstream
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            << 'EOF'
              set -e

              sudo systemctl reload nginx

              # Validate the real HTTPS Nginx virtual host. Port 80 correctly
              # redirects to HTTPS, so an HTTP probe would report 301 instead of
              # the expected anonymous 401 from the backend route.
              proxy_status=$(curl -ks -o /dev/null -w "%{http_code}" \
                --resolve "${{ env.PUBLIC_API_HOST }}:443:127.0.0.1" \
                "https://${{ env.PUBLIC_API_HOST }}/api/auth/me")
              if [ "$proxy_status" != "401" ]; then
                echo "Expected Nginx to proxy /api/auth/me with a 401; received $proxy_status."
                sudo nginx -T
                exit 1
              fi
          EOF
